name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "impl/backend" ]
  pull_request:
    branches: [ "main", "master", "impl/backend" ]

jobs:
  backend-checks:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: TypeScript Build Check
        working-directory: backend
        run: npm run build

      - name: Run Integration Tests
        working-directory: backend
        run: npm run test:integration

      - name: Run NFR-01 Benchmark & Latency Suite
        working-directory: backend
        run: npm run test:nfr

  frontend-checks:
    name: Frontend Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Oxlint Code Linting
        working-directory: frontend
        run: pnpm lint

      - name: Vitest Unit & Component Tests
        working-directory: frontend
        run: pnpm test

      - name: Production Bundle Build Check
        working-directory: frontend
        run: pnpm build
