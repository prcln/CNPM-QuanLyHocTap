openapi: 3.0.3

info:
  title: LMS API
  description: API cho hệ thống quản lý học tập
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Xác thực và đăng nhập
  - name: Accounts
    description: Quản lý tài khoản
  - name: Students
    description: Quản lý sinh viên
  - name: Lecturers
    description: Quản lý giảng viên
  - name: Courses
    description: Quản lý học phần
  - name: Classes
    description: Quản lý lớp học
  - name: Grades
    description: Quản lý điểm
  - name: Schedule
    description: Quản lý lịch học
  - name: Assignments
    description: Quản lý bài tập
  - name: Groups
    description: Quản lý nhóm bài tập

paths:

  # ============================================================
  # AUTH
  # ============================================================

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      description: Đăng nhập bằng username và password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # ACCOUNTS
  # ============================================================

  /accounts/me:
    get:
      tags: [Accounts]
      summary: Lấy tài khoản hiện tại
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts:
    get:
      tags: [Accounts]
      summary: Danh sách tài khoản
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'

    post:
      tags: [Accounts]
      summary: Tạo tài khoản
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts/{matk}:
    parameters:
      - $ref: '#/components/parameters/matk'

    get:
      tags: [Accounts]
      summary: Lấy tài khoản theo ID
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Accounts]
      summary: Cập nhật tài khoản
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

    delete:
      tags: [Accounts]
      summary: Soft delete tài khoản
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa tài khoản thành công
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # STUDENTS
  # ============================================================

  /students:
    get:
      tags: [Students]
      summary: Danh sách sinh viên
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách sinh viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

    post:
      tags: [Students]
      summary: Tạo sinh viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Tạo sinh viên thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'

  /students/me:
    get:
      tags: [Students]
      summary: Thông tin sinh viên hiện tại
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'

    put:
      tags: [Students]
      summary: Cập nhật thông tin cá nhân
      x-roles: [SV]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSelfUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'

  /students/{masv}:
    parameters:
      - $ref: '#/components/parameters/masv'

    get:
      tags: [Students]
      summary: Lấy thông tin sinh viên
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Students]
      summary: Cập nhật sinh viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'

    delete:
      tags: [Students]
      summary: Xóa sinh viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công

  /students/me/classes:
    get:
      tags: [Students]
      summary: Các lớp của sinh viên hiện tại
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lớp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'

  /students/me/grades:
    get:
      tags: [Grades]
      summary: Xem điểm của bản thân
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách điểm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'

  /students/me/grades/{malh}:
    get:
      tags: [Grades]
      summary: Xem điểm của bản thân trong một lớp
      x-roles: [SV]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      responses:
        '200':
          description: Điểm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'

  /students/{masv}/grades:
    get:
      tags: [Grades]
      summary: Xem điểm của sinh viên
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/masv'
      responses:
        '200':
          description: Danh sách điểm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'

  /students/me/gpa:
    get:
      tags: [Grades]
      summary: GPA theo học kỳ
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: GPA theo học kỳ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GpaItem'

  /students/me/cpa:
    get:
      tags: [Grades]
      summary: CPA hiện tại
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CPA
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpa:
                    type: number
                    format: double
                    nullable: true

  /students/me/schedule:
    get:
      tags: [Schedule]
      summary: Thời khóa biểu của sinh viên hiện tại
      x-roles: [SV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thời khóa biểu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

  /students/{masv}/schedule:
    get:
      tags: [Schedule]
      summary: Thời khóa biểu của sinh viên
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/masv'
      responses:
        '200':
          description: Thời khóa biểu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

  # ============================================================
  # LECTURERS
  # ============================================================

  /lecturers:
    get:
      tags: [Lecturers]
      summary: Danh sách giảng viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách giảng viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lecturer'

    post:
      tags: [Lecturers]
      summary: Tạo giảng viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LecturerCreate'
      responses:
        '201':
          description: Tạo giảng viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecturer'

  /lecturers/me:
    get:
      tags: [Lecturers]
      summary: Thông tin giảng viên hiện tại
      x-roles: [GV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin giảng viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecturer'

    put:
      tags: [Lecturers]
      summary: Cập nhật thông tin cá nhân
      x-roles: [GV]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LecturerSelfUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecturer'

  /lecturers/me/classes:
    get:
      tags: [Lecturers]
      summary: Các lớp đang phụ trách
      x-roles: [GV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lớp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'

  /lecturers/me/schedule:
    get:
      tags: [Schedule]
      summary: Lịch giảng dạy của giảng viên hiện tại
      x-roles: [GV]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lịch giảng dạy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

  /lecturers/{magv}:
    parameters:
      - $ref: '#/components/parameters/magv'

    get:
      tags: [Lecturers]
      summary: Chi tiết giảng viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin giảng viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecturer'

    put:
      tags: [Lecturers]
      summary: Cập nhật giảng viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LecturerUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecturer'

    delete:
      tags: [Lecturers]
      summary: Xóa giảng viên
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công

  # ============================================================
  # COURSES
  # ============================================================

  /courses:
    get:
      tags: [Courses]
      summary: Danh sách học phần
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách học phần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

    post:
      tags: [Courses]
      summary: Tạo học phần
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Tạo học phần
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

  /courses/{mahp}:
    parameters:
      - $ref: '#/components/parameters/mahp'

    get:
      tags: [Courses]
      summary: Chi tiết học phần
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Học phần
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

    put:
      tags: [Courses]
      summary: Cập nhật học phần
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

    delete:
      tags: [Courses]
      summary: Xóa học phần
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công

  # ============================================================
  # CLASSES
  # ============================================================

  /classes:
    get:
      tags: [Classes]
      summary: Danh sách lớp học
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lớp học
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'

    post:
      tags: [Classes]
      summary: Tạo lớp học
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreate'
      responses:
        '201':
          description: Tạo lớp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'

  /classes/{malh}:
    parameters:
      - $ref: '#/components/parameters/malh'

    get:
      tags: [Classes]
      summary: Chi tiết lớp học
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lớp học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'

    put:
      tags: [Classes]
      summary: Cập nhật lớp học
      x-roles: [AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'

    delete:
      tags: [Classes]
      summary: Xóa lớp học
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công

  /classes/{malh}/students:
    get:
      tags: [Classes]
      summary: Danh sách sinh viên trong lớp
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      responses:
        '200':
          description: Danh sách sinh viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

  /classes/{malh}/students/{masv}:
    parameters:
      - $ref: '#/components/parameters/malh'
      - $ref: '#/components/parameters/masv'

    post:
      tags: [Classes]
      summary: Thêm sinh viên vào lớp
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Thêm thành công

    delete:
      tags: [Classes]
      summary: Xóa sinh viên khỏi lớp
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công

  /classes/{malh}/lecturers:
    get:
      tags: [Classes]
      summary: Danh sách giảng viên của lớp
      x-roles: [SV, GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      responses:
        '200':
          description: Danh sách giảng viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lecturer'

  /classes/{malh}/lecturers/{magv}:
    parameters:
      - $ref: '#/components/parameters/malh'
      - $ref: '#/components/parameters/magv'

    post:
      tags: [Classes]
      summary: Gán giảng viên vào lớp
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Gán thành công

    delete:
      tags: [Classes]
      summary: Bỏ giảng viên khỏi lớp
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Bỏ thành công

  /classes/{malh}/teaching-assistants:
    get:
      tags: [Classes]
      summary: Danh sách trợ giảng
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      responses:
        '200':
          description: Danh sách trợ giảng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'

  /classes/{malh}/teaching-assistants/{masv}:
    parameters:
      - $ref: '#/components/parameters/malh'
      - $ref: '#/components/parameters/masv'

    post:
      tags: [Classes]
      summary: Gán trợ giảng
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Gán thành công

    delete:
      tags: [Classes]
      summary: Bỏ trợ giảng
      x-roles: [AD]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Bỏ thành công

  # ============================================================
  # GRADES
  # ============================================================

  /classes/{malh}/grades:
    get:
      tags: [Grades]
      summary: Bảng điểm của lớp
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      responses:
        '200':
          description: Bảng điểm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'

    post:
      tags: [Grades]
      summary: Nhập điểm
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/malh'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeCreate'
      responses:
        '201':
          description: Nhập điểm thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'

  /classes/{malh}/grades/{masv}:
    parameters:
      - $ref: '#/components/parameters/malh'
      - $ref: '#/components/parameters/masv'

    get:
      tags: [Grades]
      summary: Xem điểm của một sinh viên
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Điểm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'

    put:
      tags: [Grades]
      summary: Cập nhật điểm
      x-roles: [GV, AD]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
