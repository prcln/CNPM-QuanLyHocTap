# ==============================================================
# COMPONENTS
# ==============================================================

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    matk:
      name: matk
      in: path
      required: true
      schema:
        type: integer

    masv:
      name: masv
      in: path
      required: true
      schema:
        type: integer

    magv:
      name: magv
      in: path
      required: true
      schema:
        type: integer

    mahp:
      name: mahp
      in: path
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 10

    malh:
      name: malh
      in: path
      required: true
      schema:
        type: integer

  responses:

    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Dữ liệu bị trùng hoặc xung đột
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ==========================================================
    # AUTH / ACCOUNT
    # ==========================================================

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 255
          example: student01
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - account
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        account:
          $ref: '#/components/schemas/Account'

    Account:
      type: object
      properties:
        matk:
          type: integer
        username:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [SV, GV, AD]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: integer
          nullable: true

    AccountCreate:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum: [SV, GV, AD]

    AccountUpdate:
      type: object
      properties:
        username:
          type: string
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum: [SV, GV, AD]

    # ==========================================================
    # STUDENT
    # ==========================================================

    Student:
      type: object
      properties:
        masv:
          type: integer
          example: 20231234
        matk:
          type: integer
        hoten:
          type: string
          maxLength: 255
        gioi_tinh:
          type: string
          maxLength: 15
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        chuong_trinh:
          type: string
          maxLength: 255
          nullable: true
        truong:
          type: string
          maxLength: 255
          nullable: true
        lop:
          type: string
          maxLength: 255
          nullable: true
        khoa:
          type: integer
          nullable: true
        trang_thai:
          type: string
          maxLength: 255
          nullable: true
        cpa:
          type: number
          format: double
          nullable: true

    StudentCreate:
      type: object
      required:
        - masv
        - matk
        - hoten
      properties:
        masv:
          type: integer
        matk:
          type: integer
        hoten:
          type: string
          maxLength: 255
        gioi_tinh:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
        chuong_trinh:
          type: string
          maxLength: 255
        truong:
          type: string
          maxLength: 255
        lop:
          type: string
          maxLength: 255
        khoa:
          type: integer
        trang_thai:
          type: string
          maxLength: 255
        cpa:
          type: number
          format: double

    StudentSelfUpdate:
      type: object
      properties:
        gioi_tinh:
          type: string
          maxLength: 15
        email:
          type: string
          format: email

    StudentUpdate:
      allOf:
        - $ref: '#/components/schemas/StudentCreate'

    # ==========================================================
    # LECTURER
    # ==========================================================

    Lecturer:
      type: object
      properties:
        magv:
          type: integer
        matk:
          type: integer
        hoten:
          type: string
          maxLength: 255
        gioi_tinh:
          type: boolean
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        truong:
          type: string
          maxLength: 255
          nullable: true

    LecturerCreate:
      type: object
      required:
        - magv
        - matk
        - hoten
      properties:
        magv:
          type: integer
        matk:
          type: integer
        hoten:
          type: string
          maxLength: 255
        gioi_tinh:
          type: boolean
        email:
          type: string
          format: email
        truong:
          type: string
          maxLength: 255

    LecturerSelfUpdate:
      type: object
      properties:
        gioi_tinh:
          type: boolean
        email:
          type: string
          format: email

    LecturerUpdate:
      allOf:
        - $ref: '#/components/schemas/LecturerCreate'

    # ==========================================================
    # COURSE
    # ==========================================================

    Course:
      type: object
      properties:
        mahp:
          type: string
          minLength: 10
          maxLength: 10
        ten:
          type: string
          maxLength: 255
        truong:
          type: string
          maxLength: 255
          nullable: true
        bat_buoc:
          type: boolean
          nullable: true
        tin_chi_dao_tao:
          type: integer
          nullable: true
        tin_chi_hoc_phi:
          type: integer
          nullable: true
        phan_bo:
          type: string
          minLength: 7
          maxLength: 7
          nullable: true
        noidung:
          type: string
          nullable: true

    CourseCreate:
      type: object
      required:
        - mahp
        - ten
      properties:
        mahp:
          type: string
          minLength: 10
          maxLength: 10
        ten:
          type: string
          maxLength: 255
        truong:
          type: string
          maxLength: 255
        bat_buoc:
          type: boolean
          default: false
        tin_chi_dao_tao:
          type: integer
          default: 0
        tin_chi_hoc_phi:
          type: integer
          default: 0
        phan_bo:
          type: string
          minLength: 7
          maxLength: 7
        noidung:
          type: string

    CourseUpdate:
      allOf:
        - $ref: '#/components/schemas/CourseCreate'

    # ==========================================================
    # CLASS
    # ==========================================================

    Class:
      type: object
      properties:
        malh:
          type: integer
        mahp:
          type: string
          minLength: 10
          maxLength: 10
        malop:
          type: string
          minLength: 6
          maxLength: 6
        hoc_ky:
          type: string
          minLength: 5
          maxLength: 5
        hoc_ky_phu:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        malh_lt:
          type: integer
          nullable: true
        loai:
          type: string
          maxLength: 5
          nullable: true
        trongso_qt:
          type: number
          format: double
          nullable: true
        hinhthuc_giangday:
          type: string
          maxLength: 10
          nullable: true

    ClassCreate:
      type: object
      required:
        - mahp
        - malop
        - hoc_ky
      properties:
        mahp:
          type: string
          minLength: 10
          maxLength: 10
        malop:
          type: string
          minLength: 6
          maxLength: 6
        hoc_ky:
          type: string
          minLength: 5
          maxLength: 5
        hoc_ky_phu:
          type: string
          minLength: 2
          maxLength: 2
          default: AB
        malh_lt:
          type: integer
          nullable: true
        loai:
          type: string
          maxLength: 5
        trongso_qt:
          type: number
          format: double
        hinhthuc_giangday:
          type: string
          maxLength: 10
          default: Offline

    ClassUpdate:
      allOf:
        - $ref: '#/components/schemas/ClassCreate'

    # ==========================================================
    # GRADE
    # ==========================================================

    Grade:
      type: object
      properties:
        madiem:
          type: integer
        masv:
          type: integer
        malh:
          type: integer
        diem_qt:
          type: number
          format: double
          nullable: true
        diem_ck:
          type: number
          format: double
          nullable: true
        diem_hp:
          type: string
          maxLength: 2
          nullable: true

    GradeCreate:
      type: object
      required:
        - masv
      properties:
        masv:
          type: integer
        diem_qt:
          type: number
          format: double
          nullable: true
        diem_ck:
          type: number
          format: double
          nullable: true
        diem_hp:
          type: string
          maxLength: 2
          nullable: true

    GradeUpdate:
      type: object
      properties:
        diem_qt:
          type: number
          format: double
          nullable: true
        diem_ck:
          type: number
          format: double
          nullable: true
        diem_hp:
          type: string
          maxLength: 2
          nullable: true

    GpaItem:
      type: object
      properties:
        hoc_ky:
          type: string
          example: "20261"
        gpa:
          type: number
          format: double

    # ==========================================================
    # SCHEDULE
    # ==========================================================

    Schedule:
      type: object
      properties:
        malichhoc:
          type: integer
        malh:
          type: integer
        ngay_trong_tuan:
          type: integer
          minimum: 2
          maximum: 8
        tiet_bat_dau:
          type: integer
        tiet_ket_thuc:
          type: integer
        dia_diem:
          type: string
          minLength: 4
          maxLength: 4
        phong_hoc:
          type: string
          maxLength: 10
          nullable: true
        tuan_hoc:
          type: array
          items:
            type: integer

    ScheduleCreate:
      type: object
      required:
        - ngay_trong_tuan
        - tiet_bat_dau
        - tiet_ket_thuc
        - dia_diem
      properties:
        ngay_trong_tuan:
          type: integer
          minimum: 2
          maximum: 8
        tiet_bat_dau:
          type: integer
        tiet_ket_thuc:
          type: integer
        dia_diem:
          type: string
          minLength: 4
          maxLength: 4
        phong_hoc:
          type: string
          maxLength: 10
        tuan_hoc:
          type: array
          items:
            type: integer

    ScheduleUpdate:
      allOf:
        - $ref: '#/components/schemas/ScheduleCreate'

    # ==========================================================
    # ASSIGNMENT
    # ==========================================================

    Assignment:
      type: object
      properties:
        mabt:
          type: integer
        malh:
          type: integer
        loai:
          type: string
          maxLength: 255
          nullable: true
        noi_dung:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true

    AssignmentCreate:
      type: object
      properties:
        loai:
          type: string
          maxLength: 255
        noi_dung:
          type: string
        deadline:
          type: string
          format: date-time

    AssignmentUpdate:
      allOf:
        - $ref: '#/components/schemas/AssignmentCreate'

    # ==========================================================
    # GROUP
    # ==========================================================

    Group:
      type: object
      properties:
        manhom:
          type: integer
        mabt:
          type: integer
        de_tai:
          type: string
          nullable: true

    GroupCreate:
      type: object
      properties:
        de_tai:
          type: string

    GroupUpdate:
      allOf:
        - $ref: '#/components/schemas/GroupCreate'

    # ==========================================================
    # ERROR
    # ==========================================================

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Không tìm thấy tài nguyên
        details:
          type: object
          additionalProperties: true